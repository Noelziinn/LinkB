<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova senha | LinkB</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <main class="container">
      <a class="brand brand-center brand-lg" href="index.html">
        <img class="brand-logo" src="logo.png" alt="" />
        <span class="brand-name">LinkB</span>
      </a>
      <section class="auth-card">
        <h1>Nova senha</h1>
        <p id="reset-subtitle" class="bio">Verificando o link...</p>

        <form id="reset-form" novalidate hidden>
          <div class="field">
            <label for="password">Nova senha</label>
            <input
              id="password"
              type="password"
              autocomplete="new-password"
              placeholder="Mínimo de 6 caracteres"
              minlength="6"
              required
            />
          </div>

          <div class="field">
            <label for="confirm">Repita a nova senha</label>
            <input
              id="confirm"
              type="password"
              autocomplete="new-password"
              placeholder="Digite de novo"
              minlength="6"
              required
            />
          </div>

          <p id="message" class="message" role="alert" hidden></p>

          <button id="submit-btn" type="submit" class="btn-primary">
            Salvar nova senha
          </button>
        </form>

        <p id="back" class="toggle" hidden>
          <a class="link-btn" href="login.html">Voltar ao login</a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/reset.js"></script>
  </body>
</html>
