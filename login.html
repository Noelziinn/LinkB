<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | LinkB</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="container">
      <a class="brand brand-center brand-lg" href="index.html">
        <img class="brand-logo" src="logo.png" alt="" />
        <span class="brand-name">LinkB</span>
      </a>

      <section class="auth-card">
        <h1 id="auth-title">Entrar</h1>
        <p id="auth-subtitle" class="bio">
          Acesse seu painel para editar seus links.
        </p>

        <form id="auth-form" novalidate>
          <div class="field" id="username-field" hidden>
            <label for="username">Nome de usuário</label>
            <input
              id="username"
              type="text"
              autocomplete="username"
              placeholder="seunome"
              maxlength="30"
            />
            <small>Sua página ficará em /seunome</small>
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              placeholder="voce@email.com"
              required
            />
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Mínimo de 6 caracteres"
              minlength="6"
              required
            />
          </div>

          <button id="forgot-btn" type="button" class="link-btn forgot">
            Esqueci minha senha
          </button>

          <label class="check" id="terms-field" hidden>
            <input id="terms" type="checkbox" />
            <span>
              Li e concordo com os
              <a href="termos.html" target="_blank" rel="noopener noreferrer"
                >Termos de Uso</a
              >
              e a
              <a
                href="privacidade.html"
                target="_blank"
                rel="noopener noreferrer"
                >Política de Privacidade</a
              >.
            </span>
          </label>

          <!-- Verificação anti-robô (só aparece se a chave estiver no config.js) -->
          <div id="captcha"></div>

          <p id="message" class="message" role="alert" hidden></p>

          <button id="submit-btn" type="submit" class="btn-primary">
            Entrar
          </button>
        </form>

        <p class="toggle">
          <span id="toggle-text">Ainda não tem conta?</span>
          <button id="toggle-btn" type="button" class="link-btn">
            Criar conta
          </button>
        </p>
      </section>
    </main>

    <!-- Biblioteca do Supabase (versão fixa) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <!-- Cloudflare Turnstile: precisa vir DEPOIS do auth.js -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit"
      async
      defer
    ></script>
  </body>
</html>
