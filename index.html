<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noel | Desenvolvedor & Projetos</title>
    <meta
      name="description"
      content="Desenvolvedor Web • Criação de Sites, Sistemas & Projetos Digitais"
    />
    <meta property="og:title" content="Noel | Desenvolvedor & Projetos" />
    <meta
      property="og:description"
      content="Desenvolvedor Web • Criação de Sites, Sistemas & Projetos Digitais"
    />
    <!-- Quando hospedar, adicione: <meta property="og:image" content="https://seusite.com/foto.jpg"> -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="site.css" />
    <!-- Ícones leves do Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <main class="container">
      <!-- Cabeçalho / Perfil -->
      <header class="profile">
        <div class="avatar-wrapper">
          <!-- Troque o link abaixo pelo caminho da sua foto (ex: ./foto.jpg) -->
          <img
            src="https://github.com/identicons/jasonlong.png"
            alt="Foto de Perfil"
            class="avatar"
          />
          <span class="status-dot" title="Disponível para projetos"></span>
        </div>
        <h1>Noel</h1>
        <p class="bio">
          Desenvolvedor Web • Criação de Sites, Sistemas & Projetos Digitais
        </p>
      </header>

      <!-- Botão Principal em Destaque -->
      <section class="links">
        <a
          href="#"
          class="link-card featured"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="ph ph-rocket-launch"></i>
          <div class="link-text">
            <strong>Solicitar Orçamento</strong>
            <span>Sites, landing pages e soluções sob medida</span>
          </div>
          <i class="ph ph-arrow-up-right arrow"></i>
        </a>

        <!-- Demais Links -->
        <a href="#" class="link-card" target="_blank" rel="noopener noreferrer">
          <i class="ph ph-briefcase"></i>
          <span>Meu Portfólio</span>
          <i class="ph ph-arrow-up-right arrow"></i>
        </a>

        <a href="#" class="link-card" target="_blank" rel="noopener noreferrer">
          <i class="ph ph-robot"></i>
          <span>NStore • Sistemas & Automação</span>
          <i class="ph ph-arrow-up-right arrow"></i>
        </a>

        <a href="#" class="link-card" target="_blank" rel="noopener noreferrer">
          <i class="ph ph-github-logo"></i>
          <span>GitHub</span>
          <i class="ph ph-arrow-up-right arrow"></i>
        </a>
      </section>

      <p class="footer1">&copy; Noel Scott - All rights reserved!</p>
    </main>

    <!-- Menu lateral (os três pontinhos são criados pelo menu.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/menu.js"></script>
  </body>
</html>
